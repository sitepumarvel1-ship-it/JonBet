# Membangun dan menerbitkan JonBet ke GitHub Pages, lalu menyegarkan jadwal tiap ±5 menit (batas tercepat GitHub).
# Menit 3, 8, 13, ... dipilih supaya tidak berebut dengan lonjakan beban GitHub di menit 0 dan 30. Skor live ditambah
# langsung dari browser (lihat docs/DEPLOY.md), karena jadwal Actions bisa tertunda belasan menit.
#
# Pengaturan satu kali: di repo, Settings > Pages > Build and deployment > Source = "GitHub Actions".
# Sumber data: auto (bawaan) = ESPN utama + TheSportsDB pelengkap. Opsional: secret THESPORTSDB_KEY (kunci premium TheSportsDB),
# variabel repo JONBET_PROVIDER = auto | espn | thesportsdb | demo (demo = data simulasi). Lihat docs/DEPLOY.md.
name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Satu penerbitan pada satu waktu; yang menunggu diganti yang terbaru, yang sedang jalan tidak dibatalkan.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Ambil data dan bangun situs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # State = database rating Elo, cache permintaan, dan data terakhir yang berhasil.
      # Dipulihkan dari build sebelumnya agar model terus belajar dan permintaan ke sumber data hemat.
      - name: Pulihkan state dari build sebelumnya
        uses: actions/cache/restore@v4
        with:
          path: .pages-state
          key: jonbet-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jonbet-state-

      - name: Bangun situs
        run: npm run build:pages
        env:
          PROVIDER: ${{ vars.JONBET_PROVIDER || 'auto' }}
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}

      - name: Simpan state untuk build berikutnya
        uses: actions/cache/save@v4
        with:
          path: .pages-state
          key: jonbet-state-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Terbitkan ke GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

