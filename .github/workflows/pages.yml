name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Ambil data dan bangun situs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pulihkan state dari build sebelumnya
        uses: actions/cache/restore@v4
        with:
          path: .pages-state
          key: jonbet-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jonbet-state-

      - name: Bangun situs
        run: npm run build:pages
        env:
          PROVIDER: ${{ vars.JONBET_PROVIDER || 'auto' }}
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}

      - name: Simpan state untuk build berikutnya
        uses: actions/cache/save@v4
        with:
          path: .pages-state
          key: jonbet-state-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Terbitkan ke GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
